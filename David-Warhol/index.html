<!-- CATALOGUE-NFT-CENTERING-START -->
<style>
/* Catalogue-wide NFT presentation standard. */
body main,
body .page-content,
body .wrap {
  text-align: center;
}

/* Headings, descriptive text, and research/source sections. */
body main h1,
body main h2,
body main h3,
body main h4,
body main p,
body .page-content h1,
body .page-content h2,
body .page-content h3,
body .page-content h4,
body .page-content p,
body .wrap h1,
body .wrap h2,
body .wrap h3,
body .wrap h4,
body .wrap p,
.section-title,
.subhead,
.subhead h2,
.sources,
.sources h2,
.sources p,
.source-links,
.source-links h2,
.source-links p,
.series-intro,
.project-intro,
.intro {
  text-align: center !important;
}

/*
  Center the actual card tracks.
  The original NFT CSS often used:
      repeat(auto-fit, minmax(..., 1fr))
  which stretches a short row across the full page and leaves two-card
  groups visually parked at the left. Fixed maximum track widths keep
  incomplete rows centered.
*/
.area-card-grid {
  grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 280px)) !important;
  justify-content: center !important;
  justify-items: stretch !important;
}

.project-grid {
  grid-template-columns: repeat(auto-fit, minmax(min(245px, 100%), 320px)) !important;
  justify-content: center !important;
  justify-items: stretch !important;
}

.support-grid,
.card-grid,
.cards-grid,
.nft-grid,
.collection-grid {
  grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 300px)) !important;
  justify-content: center !important;
  justify-items: stretch !important;
}

/* Fallback for any card row implemented as flex. */
.area-card-grid,
.project-grid,
.support-grid,
.card-grid,
.cards-grid,
.nft-grid,
.collection-grid,
.grid {
  margin-left: auto !important;
  margin-right: auto !important;
}

.area-card-grid > *,
.project-grid > *,
.support-grid > *,
.card-grid > *,
.cards-grid > *,
.nft-grid > *,
.collection-grid > * {
  margin-left: auto;
  margin-right: auto;
  text-align: center;
}

/* Navigation remains centered as well. */
.nav-pills,
.top-nav,
.footer-nav,
.footer-pills,
.pill-nav {
  justify-content: center !important;
  text-align: center !important;
}
</style>
<!-- CATALOGUE-NFT-CENTERING-END -->
<!-- NFT-CENTER-FINAL-CARD-ROWS-V1-START -->
<style id="nft-center-final-card-rows-v1">
/* Center incomplete final rows at every index depth. Grid justify-content
   alone cannot center an incomplete final grid row; flex wrapping can. */
.area-card-grid,
.project-grid,
.range-grid,
.preview-grid,
.support-grid,
.card-grid,
.cards-grid,
.nft-grid,
.collection-grid,
.research-grid {
  display: flex !important;
  flex-wrap: wrap !important;
  justify-content: center !important;
  align-items: stretch;
}
.area-card-grid > *,
.range-grid > *,
.preview-grid > *,
.support-grid > *,
.card-grid > *,
.cards-grid > *,
.nft-grid > *,
.collection-grid > *,
.research-grid > * {
  flex: 0 1 280px;
  width: min(280px, 100%);
  min-width: 0;
  box-sizing: border-box;
}
.project-grid > * {
  flex: 0 1 320px;
  width: min(320px, 100%);
  min-width: 0;
  box-sizing: border-box;
}
@media (max-width: 520px) {
  .area-card-grid > *, .project-grid > *, .range-grid > *,
  .preview-grid > *, .support-grid > *, .card-grid > *,
  .cards-grid > *, .nft-grid > *, .collection-grid > *,
  .research-grid > * {
    flex-basis: min(100%, 320px);
    max-width: 100%;
  }
}
</style>
<!-- NFT-CENTER-FINAL-CARD-ROWS-V1-END -->

<style id="nft-index-four-across-v1">
@media (min-width: 1050px) {
  .area-card-grid:has(> :nth-child(4)),
  .cereal-grid:has(> :nth-child(4)),
  .project-grid:has(> :nth-child(4)),
  .range-grid:has(> :nth-child(4)),
  .preview-grid:has(> :nth-child(4)),
  .collection-grid:has(> :nth-child(4)),
  .nft-grid:has(> :nth-child(4)) {
    display:flex !important;flex-wrap:wrap !important;justify-content:center !important;
    column-gap:16px !important;row-gap:16px !important;
  }
  .area-card-grid:has(> :nth-child(4)) > *,
  .cereal-grid:has(> :nth-child(4)) > *,
  .project-grid:has(> :nth-child(4)) > *,
  .range-grid:has(> :nth-child(4)) > *,
  .preview-grid:has(> :nth-child(4)) > *,
  .collection-grid:has(> :nth-child(4)) > *,
  .nft-grid:has(> :nth-child(4)) > * {
    flex:0 0 calc((100% - 48px) / 4) !important;
    width:calc((100% - 48px) / 4) !important;
    max-width:calc((100% - 48px) / 4) !important;
    min-width:0 !important;margin-left:0 !important;margin-right:0 !important;
  }
}
@media (min-width: 700px) and (max-width: 1049px) {
  .area-card-grid:has(> :nth-child(4)) > *, .cereal-grid:has(> :nth-child(4)) > *,
  .project-grid:has(> :nth-child(4)) > *, .range-grid:has(> :nth-child(4)) > *,
  .preview-grid:has(> :nth-child(4)) > * {
    flex:0 0 calc((100% - 32px) / 3) !important;
    width:calc((100% - 32px) / 3) !important;
    max-width:calc((100% - 32px) / 3) !important;
  }
}
</style>
